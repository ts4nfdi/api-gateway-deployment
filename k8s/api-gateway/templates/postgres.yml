apiVersion: "acid.zalan.do/v1"
kind: postgresql
metadata:
  name: {{ .Release.Name }}-postgres
  annotations:
    "acid.zalan.do/controller": "ts4nfdi-operator"
  namespace: {{ .Release.Namespace }}
  labels:
    project: ts4nfdi
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/part-of: ts4nfdi-gateway
    app.kubernetes.io/component: db
    app.kubernetes.io/managed-by: Helm
spec:
  enableLogicalBackup: {{ .Values.postgres.logical_backup }}
  teamId: {{ .Release.Name }}
  volume:
    size:  {{ .Values.postgres.volume_size }}
  numberOfInstances: {{ int .Values.postgres.number_instances_postgres }}
  resources:
    requests:
      memory: 512Mi
    limits:
      memory: 1Gi
  users:
    gateway:  # Ensure user is correctly defined
      - superuser
      - createdb
  databases:
    gateway: gateway  # Ensure the database is correctly linked to the user
  preparedDatabases:
    gateway: {}  # Matches the database name to ensure it's prepared
  postgresql:
    version: "14"
